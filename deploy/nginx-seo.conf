# В Plesk: «Additional nginx directives».
# Удалите index.html из корня сайта после новой заливки — иначе nginx
# снова отдаст одну заглушку на все URL и каталог не попадёт в Google.
# На экране «Apache и nginx» в расширениях nginx не должно быть xml.

index index.php;

location = / {
    try_files /index.php =404;
}

location / {
    try_files $uri $uri/ /index.php?$args;
}
